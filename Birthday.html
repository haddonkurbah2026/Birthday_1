<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday! 🎉</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #ff6fae 0%,
                #8e7dff 50%,
                #55c8ff 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;
        }

        /* Background */
        .bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.25;
            animation: float 7s ease-in-out infinite;
        }

        .o1 {
            width: 180px;
            height: 180px;
            background: #fff;
            left: -50px;
            top: 10%;
            animation-delay: 0s;
        }

        .o2 {
            width: 240px;
            height: 240px;
            background: #ffd166;
            right: -80px;
            bottom: 5%;
            animation-delay: 2s;
        }

        .o3 {
            width: 120px;
            height: 120px;
            background: #ff4d6d;
            right: 20%;
            top: -30px;
            animation-delay: 4s;
        }

        /* Main Card */
        .card {
            position: relative;
            z-index: 2;

            width: min(92vw, 760px);

            padding: clamp(30px, 6vw, 65px) 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;

            box-shadow: 0 25px 80px rgba(30, 15, 70, 0.3);
        }

        /* Birthday Cake */
        .cake {
            font-size: clamp(55px, 10vw, 95px);
            animation: bob 2s ease-in-out infinite;
        }

        /* Heading */
        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1;
            margin: 12px 0;
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(18px, 3vw, 25px);
            opacity: 0.95;

            margin: 12px auto 30px;

            max-width: 600px;
        }

        /* Celebrate Button */
        button {
            border: 0;
            border-radius: 999px;

            padding: 17px 32px;

            font-size: 18px;
            font-weight: 800;

            cursor: pointer;

            color: #7a2859;
            background: #fff;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

            transition:
                0.2s transform,
                0.2s box-shadow;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Hidden Birthday Message */
        #message {
            margin-top: 25px;

            font-size: clamp(18px, 3vw, 24px);
            font-weight: 700;

            display: none;

            animation: pop 0.5s ease;
        }

        /* Balloons */
        .balloon {
            position: absolute;

            bottom: -150px;

            width: 55px;
            height: 70px;

            border-radius: 50% 50% 45% 45%;

            animation: rise linear infinite;

            opacity: 0.85;
        }

        .balloon::after {
            content: "";

            position: absolute;

            width: 1px;
            height: 90px;

            background: rgba(255, 255, 255, 0.7);

            left: 50%;
            top: 68px;
        }

        .b1 {
            left: 7%;
            background: #ff4d6d;
            animation-duration: 11s;
        }

        .b2 {
            left: 24%;
            background: #ffd166;
            animation-duration: 14s;
            animation-delay: 2s;
        }

        .b3 {
            left: 75%;
            background: #06d6a0;
            animation-duration: 12s;
            animation-delay: 1s;
        }

        .b4 {
            left: 90%;
            background: #4cc9f0;
            animation-duration: 15s;
            animation-delay: 4s;
        }

        /* Confetti */
        .confetti {
            position: fixed;

            top: -20px;

            z-index: 10;

            width: 10px;
            height: 18px;

            pointer-events: none;

            animation: fall 2.5s linear forwards;
        }

        /* Animations */
        @keyframes bob {
            50% {
                transform: translateY(-10px) rotate(2deg);
            }
        }

        @keyframes float {
            50% {
                transform: translateY(-30px) translateX(15px);
            }
        }

        @keyframes rise {
            to {
                transform: translateY(-125vh) rotate(25deg);
            }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            .card {
                border-radius: 24px;
                padding: 35px 18px;
            }

            .subtitle {
                margin-bottom: 24px;
            }

            button {
                width: 90%;
                max-width: 330px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="bg">

        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>

        <!-- Balloons -->
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>

    </div>


    <!-- Main Birthday Card -->
    <main class="card">

        <!-- Cake -->
        <div class="cake">
            🎂
        </div>

        <!-- Birthday Heading -->
        <h1>
            Happy Birthday! 🎉
        </h1>

        <!-- Birthday Message -->
        <div class="subtitle">
            Wishing you an amazing day filled with happiness,
            laughter, love and unforgettable memories! 💖
        </div>

        <!-- Celebrate Button -->
        <button id="celebrate">
            Click To celebrate 🎊
        </button>

        <!-- Message revealed after clicking -->
        <div id="message">
            🥳 Let the celebration begin!
            🎈✨ Have the best birthday ever! ❤️
        </div>

    </main>


    <script>

        // Get the button and hidden message
        const btn = document.getElementById("celebrate");
        const msg = document.getElementById("message");


        // Function that creates the celebration
        function celebrate() {

            // Show the birthday message
            msg.style.display = "block";


            // Change button text
            btn.textContent = "🎉 Celebrating!";


            // Create 180 pieces of confetti
            for (let i = 0; i < 180; i++) {

                const c = document.createElement("div");

                c.className = "confetti";


                // Random horizontal position
                c.style.left = Math.random() * 100 + "vw";


                // Random confetti color
                c.style.background =
                    [
                        "#ff4d6d",
                        "#ffd166",
                        "#06d6a0",
                        "#4cc9f0",
                        "#fff",
                        "#c77dff"
                    ][
                        Math.floor(Math.random() * 6)
                    ];


                // Random rotation
                c.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                // Random falling speed
                c.style.animationDuration =
                    1.8 + Math.random() * 2.2 + "s";


                // Random delay
                c.style.animationDelay =
                    Math.random() * 0.6 + "s";


                // Random width
                c.style.width =
                    6 + Math.random() * 8 + "px";


                // Random height
                c.style.height =
                    8 + Math.random() * 15 + "px";


                // Add confetti to the webpage
                document.body.appendChild(c);


                // Remove confetti after animation
                setTimeout(() => {
                    c.remove();
                }, 5000);
            }


            // Change button text after celebration starts
            setTimeout(() => {
                btn.textContent = "🎊 Celebrate Again!";
            }, 1800);
        }


        // Run celebration when button is clicked
        btn.addEventListener("click", celebrate);

    </script>

</body>

</html>
